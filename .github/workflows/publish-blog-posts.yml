name: Publish blog posts, Spanish site, and sitemap

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "i18n/**"
      - "scripts/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-blog-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the sitemap can use each page's real last-modified date

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Link any unpublished blog posts
        id: update
        run: python3 scripts/update_blog_index.py

      - name: Rebuild the Spanish site (es/) from the English pages + i18n/es.txt
        run: python3 scripts/build_spanish.py

      - name: Rebuild sitemap.xml
        run: python3 scripts/build_sitemap.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet -- blog/index.html; then
            git commit -m "Auto-update Spanish site and sitemap"
          else
            git commit -m "Auto-publish new blog post(s): ${{ steps.update.outputs.published }}"
          fi
          git push
