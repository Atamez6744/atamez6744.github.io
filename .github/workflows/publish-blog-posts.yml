name: Publish new blog posts

on:
  push:
    branches: [main]
    paths:
      - "blog/*.html"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-blog-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Link any unpublished blog posts
        id: update
        run: python3 scripts/update_blog_index.py

      - name: Commit and push if blog/index.html changed
        run: |
          if git diff --quiet -- blog/index.html; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html
          git commit -m "Auto-publish new blog post(s): ${{ steps.update.outputs.published }}"
          git push
